name: Project dates from status

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PROJECTS_PAT }}
          script: |
            const STATUS_IN_PROGRESS = 'In Progress';
            const STATUS_DONE = 'Done';
            const ORG = context.repo.owner;

            const PROJECTS = [
              {
                number: 9,
                projectId: 'PVT_kwDOCA2kqc4BUnfM',
                statusFieldId: 'PVTSSF_lADOCA2kqc4BUnfMzhBucOc',
                startDateFieldId: 'PVTF_lADOCA2kqc4BUnfMzhUEF1k',
                endDateFieldId: 'PVTF_lADOCA2kqc4BUnfMzhUEGFI',
              },
              {
                number: 11,
                projectId: 'PVT_kwDOCA2kqc4BV4Gu',
                statusFieldId: 'PVTSSF_lADOCA2kqc4BV4GuzhRQrS8',
                startDateFieldId: 'PVTF_lADOCA2kqc4BV4GuzhRQrT0',
                endDateFieldId: 'PVTF_lADOCA2kqc4BV4GuzhRlSCM',
              },
            ];

            const today = new Date().toISOString().slice(0, 10);

            // Fetch org-level Issue Fields (keyed by name) — needed since GitHub
            // now requires updateIssueFieldValue for issue items and that mutation
            // expects Issue Field IDs, not ProjectV2 field IDs.
            async function fetchOrgIssueFieldsByName() {
              const { organization } = await github.graphql(
                `query ($org: String!) {
                  organization(login: $org) {
                    issueFields(first: 50) {
                      nodes { ... on Node { id } ... on IssueFieldCommon { name } }
                    }
                  }
                }`,
                { headers: { 'GraphQL-Features': 'issue_fields' }, org: ORG }
              );
              return Object.fromEntries(
                (organization?.issueFields?.nodes ?? []).map((f) => [f.name, f.id])
              );
            }

            // Map project PVTF_ field IDs → org Issue Field IDs via matching names.
            async function buildFieldMap(projectId, pvtFieldIds, orgFieldsByName) {
              const { node } = await github.graphql(
                `query ($id: ID!) {
                  node(id: $id) {
                    ... on ProjectV2 {
                      fields(first: 50) {
                        nodes { ... on ProjectV2FieldCommon { id name } }
                      }
                    }
                  }
                }`,
                { id: projectId }
              );
              const map = {};
              for (const f of node?.fields?.nodes ?? []) {
                if (pvtFieldIds.includes(f.id)) {
                  map[f.id] = orgFieldsByName[f.name] ?? null;
                  core.info(`field "${f.name}" pvtId=${f.id} issueFieldId=${map[f.id]}`);
                }
              }
              return map;
            }

            async function listItems(projectId) {
              const items = [];
              let cursor = null;
              while (true) {
                const { node } = await github.graphql(
                  `query ($projectId: ID!, $cursor: String) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        items(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            id
                            isArchived
                            fieldValues(first: 50) {
                              nodes {
                                ... on ProjectV2ItemFieldSingleSelectValue {
                                  name
                                  field { ... on ProjectV2FieldCommon { id } }
                                }
                                ... on ProjectV2ItemFieldDateValue {
                                  date
                                  field { ... on ProjectV2FieldCommon { id } }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }`,
                  { projectId, cursor }
                );
                const page = node?.items;
                if (!page) break;
                items.push(...page.nodes);
                if (!page.pageInfo.hasNextPage) break;
                cursor = page.pageInfo.endCursor;
              }
              return items;
            }

            async function setDate(projectId, itemId, pvtFieldId, issueFieldId, value) {
              try {
                await github.graphql(
                  `mutation ($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: Date!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { date: $value }
                      }
                    ) { projectV2Item { id } }
                  }`,
                  { projectId, itemId, fieldId: pvtFieldId, value }
                );
              } catch (err) {
                if (!err.errors?.some((e) => e.message.includes('updateIssueFieldValue'))) throw err;
                if (!issueFieldId) throw new Error(`No Issue Field ID mapped for ${pvtFieldId} on item ${itemId}`);

                const { node } = await github.graphql(
                  `query ($id: ID!) {
                    node(id: $id) {
                      ... on ProjectV2Item { content { ... on Issue { id } } }
                    }
                  }`,
                  { id: itemId }
                );
                const issueId = node?.content?.id;
                if (!issueId) throw new Error(`Cannot resolve issue ID for item ${itemId}`);

                await github.graphql(
                  `mutation ($issueId: ID!, $fieldId: ID!, $value: String!) {
                    updateIssueFieldValue(
                      input: {
                        issueId: $issueId
                        issueField: { fieldId: $fieldId, dateValue: $value }
                      }
                    ) { issue { id } }
                  }`,
                  { headers: { 'GraphQL-Features': 'issue_fields' }, issueId, fieldId: issueFieldId, value }
                );
              }
            }

            const orgIssueFieldsByName = await fetchOrgIssueFieldsByName();
            core.info(`org issue fields: [${Object.keys(orgIssueFieldsByName).join(', ')}]`);

            let totalUpdates = 0;
            for (const cfg of PROJECTS) {
              const fieldMap = await buildFieldMap(
                cfg.projectId,
                [cfg.startDateFieldId, cfg.endDateFieldId],
                orgIssueFieldsByName
              );

              const items = await listItems(cfg.projectId);
              core.info(`project=${cfg.number} items=${items.length}`);

              let updates = 0;
              for (const it of items) {
                if (it.isArchived) continue;
                const fvs = it.fieldValues?.nodes ?? [];
                const status = fvs.find((n) => n.field?.id === cfg.statusFieldId)?.name ?? null;
                const startDate = fvs.find((n) => n.field?.id === cfg.startDateFieldId)?.date ?? null;
                const endDate = fvs.find((n) => n.field?.id === cfg.endDateFieldId)?.date ?? null;

                if (status === STATUS_IN_PROGRESS && !startDate) {
                  await setDate(cfg.projectId, it.id, cfg.startDateFieldId, fieldMap[cfg.startDateFieldId], today);
                  core.info(`project=${cfg.number} item=${it.id} set start_date=${today}`);
                  updates++;
                }
                if (status === STATUS_DONE && !endDate) {
                  await setDate(cfg.projectId, it.id, cfg.endDateFieldId, fieldMap[cfg.endDateFieldId], today);
                  core.info(`project=${cfg.number} item=${it.id} set end_date=${today}`);
                  updates++;
                }
              }
              core.info(`project=${cfg.number} updates=${updates}`);
              totalUpdates += updates;
            }
            core.info(`done updates=${totalUpdates}`);
