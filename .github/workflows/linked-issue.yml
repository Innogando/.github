# Same contract as Innogando/github-workflows/linked-issue, but INLINED: this
# repo is public (the org profile requires it) and GitHub does not let a public
# repo consume actions from a private repo — the @v2 caller resolves everywhere
# else in the fleet but "not found"s here. Keep this copy in sync with the
# action if its logic changes.
name: Linked Issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  pull-requests: write   # post / update the advisory comment
  issues: read           # closingIssuesReferences needs it
  contents: read

concurrency:
  group: linked-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linked-issue:
    name: Linked Issue
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Resolve linked issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: block
          ADD_CLOSES: "true"
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          MARK='<!-- innogando-linked-issue -->'
          owner="${REPO%/*}"; name="${REPO#*/}"

          linked=$(gh api graphql -f query='query($o:String!,$n:String!,$pr:Int!){
              repository(owner:$o,name:$n){pullRequest(number:$pr){
                closingIssuesReferences(first:5){nodes{url}}}}}' \
            -F o="$owner" -F n="$name" -F pr="$PR" --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].url')
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')

          verdict=""; reason=""
          if [[ -n "$linked" ]]; then
            verdict=pass; reason="linked: $(echo "$linked" | tr '\n' ' ')"
          elif [[ "$HEAD_REF" =~ ^([a-z]+/)?(issue-)?([0-9]{1,6})[-_][A-Za-z] ]]; then
            n="${BASH_REMATCH[3]}"
            verdict=pass; reason="issue number in branch name: https://github.com/$REPO/issues/$n"
            if [[ "$ADD_CLOSES" == "true" ]]; then
              body_now=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body')
              if ! grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+(#$n([^0-9]|\$)|https://github.com/$REPO/issues/$n([^0-9]|\$))" <<<"$body_now"; then
                printf '%s\n\nCloses https://github.com/%s/issues/%s\n' "$body_now" "$REPO" "$n" \
                  | gh pr edit "$PR" --repo "$REPO" --body-file - >/dev/null
                reason="$reason — added \`Closes\` to the body"
              fi
            fi
          elif [[ "$AUTHOR_TYPE" == "Bot" ]]; then
            verdict=pass; reason="bot author"
          elif grep -qx 'no-issue' <<<"$labels"; then
            why=$(grep -Ex 'chore|deps|release|hotfix' <<<"$labels" | head -1 || true)
            if [[ -n "$why" ]]; then
              verdict=pass; reason="exempt: no-issue + $why"
              [[ "$why" == hotfix ]] && reason="$reason — an Incident issue must be opened within 24 h and linked here"
            else
              verdict=fail; reason="label \`no-issue\` needs exactly one reason label: chore, deps, release or hotfix"
            fi
          else
            verdict=fail; reason="no linked issue. Add \`Closes https://github.com/$REPO/issues/<n>\` to the body, or the label \`no-issue\` plus a reason label"
          fi

          body="$MARK
          **Linked Issue** · ${verdict^^} — $reason"
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -1 || true)
          if [[ "$verdict" == fail || -n "$existing" ]]; then
            if [[ -n "$existing" ]]; then gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
            else gh pr comment "$PR" --repo "$REPO" --body "$body" >/dev/null; fi
          fi
          echo "::notice title=Linked Issue::$verdict — $reason"
          if [[ "$verdict" == fail && "$MODE" == block ]]; then exit 1; fi
