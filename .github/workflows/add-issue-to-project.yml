name: Add issue to a project board

# One entry point for both boards. Which board and Area an issue gets comes from
# registry/repos.yml in this repo -- see registry/registry.py for the decision, and
# registry/test_registry.py for what it guarantees.
#
# Two things this deliberately does NOT do, because both used to bite:
#   - it never stores Area option ids. Editing a single-select field regenerates
#     every option id (learned 2026-09-01), and the two boards reuse the same id
#     strings for different names, so ids are resolved by name at run time.
#   - it has no catch-all default. A repo nobody registered fails the run instead
#     of quietly filing its issues under Cross / Platform.

on:
  workflow_call:
    secrets:
      GH_PROJECTS_PAT:
        required: true

jobs:
  add-and-set-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the registry
        uses: actions/checkout@v4
        with:
          repository: Innogando/.github
          ref: main
          # Innogando/.github is private, so the caller's GITHUB_TOKEN cannot read it.
          token: ${{ secrets.GH_PROJECTS_PAT }}
          sparse-checkout: registry

      - name: Install PyYAML if the runner lacks it
        run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

      - name: Resolve the board and Area from the registry
        id: route
        env:
          REPO: ${{ github.event.repository.name }}
          LABELS_JSON: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          python3 registry/resolve.py --repo "$REPO" --labels "$LABELS_JSON"

      - name: Add issue to project
        id: add
        if: steps.route.outputs.skip != 'true'
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/Innogando/projects/${{ steps.route.outputs.project }}
          github-token: ${{ secrets.GH_PROJECTS_PAT }}

      - name: Set Area
        if: steps.route.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECTS_PAT }}
          PROJECT_ID: ${{ steps.route.outputs.project_id }}
          ITEM_ID: ${{ steps.add.outputs.itemId }}
          FIELD_NAME: Area
          WANT: ${{ steps.route.outputs.area }}
        run: |
          set -euo pipefail

          # Resolve the field id and the option id by NAME, every run, never cached:
          # editing a single-select regenerates every option id, and #11 reuses #9's
          # id strings for different names.
          # A missing field yields an empty FIELD_ID rather than aborting, so the
          # caller below can say which of the two went wrong.
          resolved=$(
            gh api graphql -f query='
              query($project: ID!, $field: String!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    field(name: $field) {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }
            ' -f project="$PROJECT_ID" -f field="$FIELD_NAME" 2>/dev/null \
              | jq -r --arg want "$WANT" '
                  (.data.node.field // {})
                  | [ (.id // "")
                    , ((((.options // [])[] | select(.name == $want)).id) // "")
                    ]
                  | @tsv
                '
          ) || resolved=""
          FIELD_ID=$(printf '%s' "$resolved" | cut -f1)
          OPTION_ID=$(printf '%s' "$resolved" | cut -f2)
          if [ -z "$FIELD_ID" ]; then
            echo "::error::Project $PROJECT_ID has no Area field."
            exit 1
          fi
          if [ -z "$OPTION_ID" ]; then
            echo "::error::Area '$WANT' is not an option of project $PROJECT_ID." \
                 "registry-validate.yml should have caught this -- check registry/repos.yml."
            exit 1
          fi
          echo "Area '$WANT' -> option $OPTION_ID on field $FIELD_ID"
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $opt: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId:    $item
                fieldId:   $field
                value:     { singleSelectOptionId: $opt }
              }) { projectV2Item { id } }
            }
          ' -f project="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$FIELD_ID" -f opt="$OPTION_ID"

      - name: Set the board's default Priority
        if: steps.route.outputs.skip != 'true' && steps.route.outputs.default_priority != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECTS_PAT }}
          PROJECT_ID: ${{ steps.route.outputs.project_id }}
          ITEM_ID: ${{ steps.add.outputs.itemId }}
          FIELD_NAME: Priority
          WANT: ${{ steps.route.outputs.default_priority }}
        run: |
          set -euo pipefail

          # Resolve the field id and the option id by NAME, every run, never cached:
          # editing a single-select regenerates every option id, and #11 reuses #9's
          # id strings for different names.
          # A missing field yields an empty FIELD_ID rather than aborting, so the
          # caller below can say which of the two went wrong.
          resolved=$(
            gh api graphql -f query='
              query($project: ID!, $field: String!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    field(name: $field) {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }
            ' -f project="$PROJECT_ID" -f field="$FIELD_NAME" 2>/dev/null \
              | jq -r --arg want "$WANT" '
                  (.data.node.field // {})
                  | [ (.id // "")
                    , ((((.options // [])[] | select(.name == $want)).id) // "")
                    ]
                  | @tsv
                '
          ) || resolved=""
          FIELD_ID=$(printf '%s' "$resolved" | cut -f1)
          OPTION_ID=$(printf '%s' "$resolved" | cut -f2)
          if [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "::warning::Project $PROJECT_ID has no Priority option '$WANT'; leaving it unset."
            exit 0
          fi
          echo "Priority '$WANT' -> option $OPTION_ID on field $FIELD_ID"
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $opt: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId:    $item
                fieldId:   $field
                value:     { singleSelectOptionId: $opt }
              }) { projectV2Item { id } }
            }
          ' -f project="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$FIELD_ID" -f opt="$OPTION_ID"

      - name: Ensure Issue Type (default Task; censo/support labels override)
        if: steps.route.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECTS_PAT }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          LABELS_JSON: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail

          current=$(gh api graphql -f query='
            query($issue: ID!) {
              node(id: $issue) { ... on Issue { issueType { name } } }
            }
          ' -f issue="$ISSUE_NODE_ID" | jq -r '.data.node.issueType.name // empty')

          if [ -n "$current" ]; then
            echo "Issue already has type '$current' (set by template or user). Skipping."
            exit 0
          fi

          labels=$(echo "$LABELS_JSON" | jq -r '.[]')
          if echo "$labels" | grep -qx "censo"; then
            TYPE_ID="IT_kwDOCA2kqc4B-ccB"  # Censo
          elif echo "$labels" | grep -qx "support"; then
            TYPE_ID="IT_kwDOCA2kqc4B-AWn"  # Support
          else
            TYPE_ID="IT_kwDOCA2kqc4BK9Nl"  # Task (default)
          fi

          gh api graphql -f query='
            mutation($issue: ID!, $type: ID!) {
              updateIssueIssueType(input: { issueId: $issue, issueTypeId: $type }) {
                issue { id issueType { name } }
              }
            }
          ' -f issue="$ISSUE_NODE_ID" -f type="$TYPE_ID"
