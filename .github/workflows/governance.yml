# Governance — this repo's small PR checks as steps of ONE job, the same shape as the
# fleet's reusable Innogando/github-workflows/.github/workflows/governance.yml.
#
# INLINED, not `uses:` — this repo is public (the org profile requires it) and GitHub
# does not let a public repo consume workflows or actions from a private repo. Keep it
# in sync with the shared workflow and actions if their logic changes.
#
# Each check publishes one COMMIT STATUS under the name the ruleset requires:
#   Linked Issue       inlined copy of github-workflows/linked-issue (main-only subset:
#                      the non-default-base body parsing and the agent-PR contract are
#                      not ported, because PRs here only target main), plus the
#                      warn-only Evidence step (contract: Innogando/.github#58; on here,
#                      this repo owns the PR template).
#   Risk Path Review   github-workflows/risk-path-review, checked out with a token (a
#                      checkout of a private repo works where `uses:` does not) and
#                      run from the workspace. Map: .github/risk-paths.yml.
# A status posted with GITHUB_TOKEN comes from the GitHub Actions app, which is what the
# ruleset pins `Linked Issue` to. The job's own check run ("Governance") is red when any
# check is red and is not meant to be required.
#
# Events: pull_request runs both checks on every action (opened, edited, labeled, ...);
# pull_request_review only Risk Path Review. Concurrency is keyed on event + PR + head SHA
# and the latest run in a group must publish everything the cancelled one would have
# (github-workflows#143).
name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
    branches: [main]
  pull_request_review:            # only re-runs Risk Path Review
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write   # post / update the advisory comments
  issues: read           # closingIssuesReferences needs it
  statuses: write        # one commit status per check

# One group per event kind AND head SHA. Do not drop the SHA or the event name: an
# `edited` run would cancel the push run, or a review run the pull_request run, and the
# head would be left without some required statuses (github-workflows#143).
concurrency:
  group: governance-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Fork PRs get no secrets; review events only matter for PRs into main.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    env:
      PR_EVENT: ${{ github.event_name == 'pull_request' }}
      REVIEW_EVENT: ${{ github.event_name == 'pull_request_review' }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # A required check reads "pending" rather than "expected" while the job runs.
      - name: Mark checks pending
        if: env.PR_EVENT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="Linked Issue" \
            -f description="Running in the Governance job" -f target_url="$RUN_URL" > /dev/null

      - name: Linked Issue
        id: linked_issue
        if: env.PR_EVENT == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: block
          ADD_CLOSES: "false"
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          BOT_ALLOWLIST: "renovate[bot],dependabot[bot],innogando-brain-catalog[bot],innogando-hermes[bot]"
        run: |
          set -euo pipefail
          MARK='<!-- innogando-linked-issue -->'
          owner="${REPO%/*}"; name="${REPO#*/}"
          # One login per line; commas, spaces and newlines all separate entries.
          bots=$(tr ', \t' '\n\n\n' <<<"$BOT_ALLOWLIST")

          linked=$(gh api graphql -f query='query($o:String!,$n:String!,$pr:Int!){
              repository(owner:$o,name:$n){pullRequest(number:$pr){
                closingIssuesReferences(first:5){nodes{url}}}}}' \
            -F o="$owner" -F n="$name" -F pr="$PR" --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].url')
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')

          verdict=""; reason=""
          if [[ -n "$linked" ]]; then
            verdict=pass; reason="linked: $(echo "$linked" | tr '\n' ' ')"
          elif [[ "$HEAD_REF" =~ ^([a-z]+/)?(issue-)?([0-9]{1,6})[-_][A-Za-z] ]]; then
            n="${BASH_REMATCH[3]}"
            verdict=pass; reason="issue number in branch name: https://github.com/$REPO/issues/$n"
            if [[ "$ADD_CLOSES" == "true" ]]; then
              body_now=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body')
              if ! grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+(#$n([^0-9]|\$)|https://github.com/$REPO/issues/$n([^0-9]|\$))" <<<"$body_now"; then
                printf '%s\n\nCloses https://github.com/%s/issues/%s\n' "$body_now" "$REPO" "$n" \
                  | gh pr edit "$PR" --repo "$REPO" --body-file - >/dev/null
                reason="$reason — added \`Closes\` to the body"
              fi
            else
              reason="$reason (not auto-closed on merge; add \`Closes\` to the body only if merging should close it)"
            fi
          elif [[ -n "$AUTHOR_LOGIN" ]] && grep -qxF -- "$AUTHOR_LOGIN" <<<"$bots"; then
            verdict=pass; reason="bot allowlist: $AUTHOR_LOGIN"
          elif grep -qx 'no-issue' <<<"$labels"; then
            why=$(grep -Ex 'chore|deps|release|hotfix' <<<"$labels" | head -1 || true)
            if [[ -n "$why" ]]; then
              verdict=pass; reason="exempt: no-issue + $why"
              [[ "$why" == hotfix ]] && reason="$reason — an Incident issue must be opened within 24 h and linked here"
            else
              verdict=fail; reason="label \`no-issue\` needs exactly one reason label: chore, deps, release or hotfix"
            fi
          else
            note=""
            [[ "$AUTHOR_LOGIN" == *'[bot]' ]] && note=" \`$AUTHOR_LOGIN\` is not on this check's \`bot_allowlist\`."
            verdict=fail; reason="no linked issue.$note To fix, add \`Closes #<n>\` to the body (or link the issue in the Development sidebar); or work on a branch named \`<type>/<n>-…\` (a new PR: renaming an open PR's branch closes it); or add the label \`no-issue\` plus a reason label"
          fi

          body="$MARK
          **Linked Issue** · ${verdict^^} — $reason"
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -1 || true)
          if [[ "$verdict" == fail || -n "$existing" ]]; then
            if [[ -n "$existing" ]]; then gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
            else gh pr comment "$PR" --repo "$REPO" --body "$body" >/dev/null; fi
          fi
          echo "::notice title=Linked Issue::$verdict — $reason"
          if [[ "$verdict" == fail && "$MODE" == block ]]; then exit 1; fi

      # Warn-only, so `if: always()`: in block mode the step above may already have failed
      # the job, and the author should still learn about the Evidence section in the same run.
      # No `set -e`, and every path ends in `exit 0`: this step must never be what fails a PR.
      - name: Check Evidence section
        if: always() && env.PR_EVENT == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          BOT_ALLOWLIST: "renovate[bot],dependabot[bot],innogando-brain-catalog[bot],innogando-hermes[bot]"
        run: |
          set -uo pipefail
          MARK='<!-- innogando-pr-evidence -->'
          if tr ', \t' '\n\n\n' <<<"$BOT_ALLOWLIST" | grep -qxF -- "$AUTHOR_LOGIN"; then
            echo "::notice title=PR Evidence::skipped: $AUTHOR_LOGIN is on bot_allowlist"
            exit 0
          fi
          if ! body=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body'); then
            echo "::warning title=PR Evidence::could not read the PR body; Evidence was NOT checked."
            exit 0
          fi
          # Inlined copy of github-workflows linked-issue/evidence.py; keep the two in sync.
          classifier=$(mktemp)
          cat >"$classifier" <<'PY'
          import re
          import sys

          HEADER = re.compile(r"^## Evidence[ \t]*\r?$", re.M)
          NEXT_SECTION = re.compile(r"^## ", re.M)
          COMMENT = re.compile(r"<!--.*?-->", re.S)
          FILLER = re.compile(r"^\s*(?:[-*](?:\s*\[[ xX]?\])?)?\s*(?:[^:\n]{1,40}:)?\s*$")
          PLACEHOLDER = re.compile(r"^\s*(?:n/a|na|none|-|tbd)\s*$", re.I)


          def classify(body):
              m = HEADER.search(body or "")
              if not m:
                  return "missing"
              rest = body[m.end():]
              end = NEXT_SECTION.search(rest)
              section = COMMENT.sub("", rest[: end.start()] if end else rest)
              lines = [line for line in section.splitlines() if not FILLER.match(line)]
              if not lines or (len(lines) == 1 and PLACEHOLDER.match(lines[0])):
                  return "empty"
              return "pass"


          print(classify(sys.stdin.read()))
          PY
          result=$(python3 "$classifier" <<<"$body") || result=error
          case "$result" in
            missing) msg='**PR Evidence** · WARN — no `## Evidence` section. Add it from the org PR template: the test command and result, screenshots for UI, query timing on production-sized data, migration backward-compat. One sentence is enough for docs-only changes.' ;;
            empty)   msg='**PR Evidence** · WARN — the `## Evidence` section is empty. Paste the test command and its result (and screenshots / query timing / migration note where they apply). If none applies, say why in one sentence.' ;;
            pass)    msg='' ;;
            *)       echo "::warning title=PR Evidence::checker failed; Evidence was NOT checked."; exit 0 ;;
          esac
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -1) || existing=""
          if [[ -z "$msg" ]]; then
            echo "::notice title=PR Evidence::pass"
            [[ -n "$existing" ]] && { gh api -X DELETE "repos/$REPO/issues/comments/$existing" >/dev/null \
              || echo "::warning title=PR Evidence::could not delete the earlier warning comment"; }
            exit 0
          fi
          echo "::warning title=PR Evidence::${msg#\*\*PR Evidence\*\* · }"
          comment="$MARK
          $msg"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$comment" >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body "$comment" >/dev/null
          fi || echo "::warning title=PR Evidence::could not post the sticky comment"
          exit 0

      # On EVERY pull_request action, not only on a new head: an `edited` or `labeled` run
      # cancels the run for the same SHA (one concurrency group per SHA), so skipping it
      # here would leave that SHA with no `Risk Path Review` at all (github-workflows#143).
      - name: Fetch risk-path-review
        id: risk_lib
        if: always() && (env.REVIEW_EVENT == 'true' || env.PR_EVENT == 'true')
        uses: actions/checkout@v4
        with:
          repository: Innogando/github-workflows
          ref: main
          token: ${{ secrets.GH_PROJECTS_PAT }}
          path: .governance-lib
          sparse-checkout: risk-path-review
          persist-credentials: false

      # Posts its own status (it re-evaluates when a review lands mid-run).
      - name: Risk Path Review
        id: risk_path_review
        if: always() && steps.risk_lib.outcome == 'success'
        continue-on-error: true
        uses: ./.governance-lib/risk-path-review
        with:
          org_token: ${{ secrets.GH_PROJECTS_PAT }}   # read:org; GITHUB_TOKEN cannot read team membership

      - name: Publish statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LINKED_OUTCOME: ${{ steps.linked_issue.outcome }}
          RISK_OUTCOME: ${{ steps.risk_path_review.outcome }}
          RISK_LIB_OUTCOME: ${{ steps.risk_lib.outcome }}
        run: |
          set -uo pipefail
          failed=0
          case "$LINKED_OUTCOME" in
            success)   state=success; desc="Passed in the Governance job" ;;
            failure)   state=failure; desc="Failed: see the 'Linked Issue' step of the Governance job"; failed=1 ;;
            cancelled) state=error;   desc="Cancelled"; failed=1 ;;
            skipped|"") state="" ;;   # review event
            *)         state=error;   desc="Unexpected outcome: $LINKED_OUTCOME"; failed=1 ;;
          esac
          if [[ -n "$state" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="Linked Issue" \
              -f description="$desc" -f target_url="$RUN_URL" > /dev/null \
              || { echo "::error::Could not publish the 'Linked Issue' status"; failed=1; }
            echo "Linked Issue: $state"
          fi
          [[ "$RISK_OUTCOME" == "failure" ]] && failed=1
          if [[ "$RISK_LIB_OUTCOME" == "failure" ]]; then
            echo "::error::Could not check out Innogando/github-workflows (is GH_PROJECTS_PAT set?)"
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=error -f context="Risk Path Review" \
              -f description="Could not load the check (token?)" -f target_url="$RUN_URL" > /dev/null || true
            failed=1
          fi
          exit $failed
