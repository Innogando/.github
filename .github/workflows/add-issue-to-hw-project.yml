name: Add issue to a project board (hardware alias)

# Compatibility shim. The two add-issue workflows collapsed into
# add-issue-to-project.yml, which routes by registry/repos.yml rather than by which
# file the caller happened to pick. This alias keeps the hardware repos' existing
# auto-add-to-project.yml working until they are repointed, and is then deleted.

on:
  workflow_call:
    secrets:
      GH_PROJECTS_PAT:
        required: true

jobs:
  add:
    uses: Innogando/.github/.github/workflows/add-issue-to-project.yml@main
    secrets: inherit
